name: Badges

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: badges
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Read repository language statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/languages" > "$RUNNER_TEMP/languages.json"
      - name: Prepare the separate badges branch
        run: |
          git ls-remote --heads origin badges > "$RUNNER_TEMP/badges-ref"
          if [ -s "$RUNNER_TEMP/badges-ref" ]; then
            git fetch origin badges
            git worktree add --detach "$RUNNER_TEMP/badges" FETCH_HEAD
          else
            git worktree add --detach "$RUNNER_TEMP/badges"
            git -C "$RUNNER_TEMP/badges" switch --orphan badges
          fi
      - name: Generate the dynamic Python percentage
        run: python -m scripts.language_badge "$RUNNER_TEMP/languages.json" "$RUNNER_TEMP/badges/python.json"
      - name: Commit only badge data
        working-directory: ${{ runner.temp }}/badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- python.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update language badge"
          git push origin HEAD:refs/heads/badges
